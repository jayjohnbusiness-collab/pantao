<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>PANTAO — The Reveal</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=Inter:wght@300;400;500&display=swap" rel="stylesheet" />
<style>
  :root{
    --paper:#f5f6f5; --ink:#16181c; --serif:"Cormorant Garamond",Georgia,serif; --sans:"Inter",Arial,sans-serif;
    --ease:cubic-bezier(.22,1,.36,1);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:var(--sans);font-weight:300;color:var(--ink);background:var(--paper);-webkit-font-smoothing:antialiased}

  .spacer{min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:0 8vw}
  .spacer .eyebrow{font-size:11px;letter-spacing:.32em;text-transform:uppercase;color:#5c666f;margin-bottom:1.2rem}
  .spacer h1{font-family:var(--serif);font-weight:500;font-size:clamp(2.4rem,7vw,6rem);line-height:.95}
  .spacer .em{font-style:italic}
  .spacer--out{background:#0e0f11;color:#f5f6f5}
  .spacer--out .eyebrow{color:#9aa0a6}

  /* ---------- THE REVEAL ---------- */
  .scene{position:relative;height:300vh}
  .stage{position:sticky;top:0;height:100vh;overflow:hidden;--p:0;background:#0b0c0e}
  .stage{--focus:clamp(0,(0.55 - var(--p))/0.55,1)}

  /* blurred campaign backdrop — atmosphere + something for the glass to blur */
  .bg{position:absolute;inset:0;background:url(../assets/img/hero.jpg) center/cover;
    filter:blur(calc(8px + var(--focus)*12px)) brightness(calc(0.62 - var(--focus)*0.12)) saturate(1.05);
    transform:scale(calc(1.08 + var(--focus)*0.08));will-change:filter,transform}
  .bg__scrim{position:absolute;inset:0;pointer-events:none;background:radial-gradient(120% 90% at 50% 40%,transparent 40%,rgba(6,8,10,.55))}

  .stage__hint{position:absolute;left:50%;bottom:7vh;transform:translateX(-50%);z-index:6;text-align:center;color:#f5f6f5;
    opacity:clamp(0,(0.14 - var(--p))/0.14,1)}
  .stage__hint span{font-size:10px;letter-spacing:.34em;text-transform:uppercase;opacity:.85}
  .stage__hint .bar{width:1px;height:44px;margin:12px auto 0;background:linear-gradient(#f5f6f5,transparent)}

  .stage__pl{position:absolute;top:0;left:0;height:2px;background:#fff;width:calc(var(--p)*100%);z-index:7;opacity:.45}

  /* centered two-column stage: image left, glass card right */
  .grid{position:absolute;inset:0;z-index:4;display:grid;grid-template-columns:1fr 1fr;
    align-items:center;gap:clamp(2rem,5vw,5rem);
    max-width:1160px;margin:0 auto;padding:0 clamp(20px,5vw,72px)}

  /* LEFT — product image, reveals bottom-up on scroll */
  .media{--mp:clamp(0,(var(--p) - 0.26)/0.3,1);
    aspect-ratio:4/5;position:relative;overflow:hidden;border-radius:14px;
    background:linear-gradient(150deg,#eceded,#d3d6d7 55%,#aeb2b3);
    clip-path:inset(calc((1 - var(--mp))*100%) 0 0 0);
    transform:scale(calc(0.96 + var(--mp)*0.04));
    box-shadow:0 30px 80px rgba(0,0,0,.4)}
  .media::after{content:"PRODUCT IMAGE";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font-size:11px;letter-spacing:.3em;color:rgba(0,0,0,.28)}

  /* RIGHT — glass pricing card, rises + fades in */
  .panel{--pp:clamp(0,(var(--p) - 0.48)/0.26,1);
    color:#fff;opacity:var(--pp);transform:translateY(calc((1 - var(--pp))*54px));
    background:linear-gradient(135deg,rgba(255,255,255,.30),rgba(255,255,255,0) 46%),rgba(255,255,255,.15);
    -webkit-backdrop-filter:blur(30px) saturate(180%);backdrop-filter:blur(30px) saturate(180%);
    border:1px solid rgba(255,255,255,.35);border-radius:22px;padding:clamp(26px,3vw,42px);
    box-shadow:0 24px 70px rgba(0,0,0,.34),inset 0 1px 0 rgba(255,255,255,.5)}
  .panel .kick{font-size:11px;letter-spacing:.3em;text-transform:uppercase;opacity:.85;margin-bottom:1.1rem}
  .name{font-family:var(--serif);font-weight:500;line-height:1.0;font-size:clamp(2rem,3.2vw+.5rem,3rem);margin-bottom:.5rem}
  .name .ln{display:block;overflow:hidden}
  .name .ln i{display:block;font-style:normal}
  .name .ln:nth-child(1) i{transform:translateY(calc((1 - clamp(0,(var(--p) - 0.5)/0.2,1))*115%))}
  .name .ln:nth-child(2) i{font-style:italic;transform:translateY(calc((1 - clamp(0,(var(--p) - 0.56)/0.2,1))*115%))}
  .price{font-family:var(--serif);font-size:1.6rem;margin-bottom:1.3rem}
  .buy{--bp:clamp(0,(var(--p) - 0.68)/0.3,1);opacity:var(--bp);transform:translateY(calc((1 - var(--bp))*22px))}
  .sizes{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:1rem}
  .size{min-width:46px;padding:10px 14px;border:1px solid rgba(255,255,255,.4);color:#fff;background:transparent;font-size:12px;letter-spacing:.06em;cursor:pointer}
  .size.sel{background:#fff;color:var(--ink);border-color:#fff}
  .cta{display:flex;gap:10px;flex-wrap:wrap}
  .btn{font-family:var(--sans);font-size:12px;letter-spacing:.18em;text-transform:uppercase;padding:14px 26px;border-radius:100px;border:1px solid #fff;cursor:pointer;transition:.35s var(--ease)}
  .btn--solid{background:#fff;color:var(--ink)}
  .btn--solid:hover{background:transparent;color:#fff}
  .btn--line{background:transparent;color:#fff}

  .sound{position:fixed;right:20px;top:20px;z-index:20;display:flex;align-items:center;gap:8px;
    background:rgba(255,255,255,.14);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);
    border:1px solid rgba(255,255,255,.4);border-radius:100px;padding:8px 14px;color:#fff;cursor:pointer;
    font-size:10px;letter-spacing:.2em;text-transform:uppercase;mix-blend-mode:difference}

  @media(max-width:820px){
    .grid{grid-template-columns:1fr;gap:1.5rem;align-content:center;justify-items:stretch;padding-top:12vh}
    .media{aspect-ratio:4/3}
    .panel{max-width:100%}
  }
</style>
</head>
<body>

  <div class="sound" id="soundToggle">◈ <span id="soundLabel">Sound off</span></div>

  <section class="spacer">
    <div>
      <p class="eyebrow">Edition V · MMXXVI · Manila</p>
      <h1>The doors<br><span class="em">are open.</span></h1>
    </div>
  </section>

  <section class="scene" id="scene">
    <div class="stage" id="stage">
      <div class="stage__pl"></div>
      <div class="bg"></div>
      <div class="bg__scrim"></div>

      <div class="grid">
        <div class="media"></div>
        <div class="panel">
          <p class="kick">The Piece · Edition V</p>
          <h2 class="name">
            <span class="ln"><i>Vitrine Distressed</i></span>
            <span class="ln"><i>Knit</i></span>
          </h2>
          <p class="price">$345</p>
          <div class="buy">
            <div class="sizes"><button class="size">S</button><button class="size sel">M</button><button class="size">L</button><button class="size">XL</button></div>
            <div class="cta"><button class="btn btn--solid">Add to bag</button><button class="btn btn--line">Buy now</button></div>
          </div>
        </div>
      </div>

      <div class="stage__hint"><span>Scroll to reveal</span><div class="bar"></div></div>
    </div>
  </section>

  <section class="spacer spacer--out">
    <div>
      <p class="eyebrow">Numbered · Limited count</p>
      <h1 style="font-size:clamp(2rem,5vw,4rem)">Once the edition<br><span class="em">closes, it does not reopen.</span></h1>
    </div>
  </section>

<script>
  var stage=document.getElementById('stage'), scene=document.getElementById('scene');
  var clamp=function(v){return Math.max(0,Math.min(1,v));};
  var ticking=false, lastP=0;
  function update(){
    var r=scene.getBoundingClientRect();
    var total=r.height-window.innerHeight;
    var p=clamp((-r.top)/total);
    stage.style.setProperty('--p', p.toFixed(4));
    if(lastP<0.5 && p>=0.5) chime();
    lastP=p; ticking=false;
  }
  window.addEventListener('scroll',function(){ if(!ticking){ ticking=true; requestAnimationFrame(update);} },{passive:true});
  window.addEventListener('resize',update); update();

  var soundOn=false, actx=null;
  var toggle=document.getElementById('soundToggle'), label=document.getElementById('soundLabel');
  toggle.addEventListener('click',function(){
    soundOn=!soundOn; label.textContent=soundOn?'Sound on':'Sound off';
    if(soundOn && !actx){ try{ actx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} }
    if(soundOn && actx && actx.state==='suspended') actx.resume();
  });
  function chime(){
    if(!soundOn||!actx) return;
    var t=actx.currentTime;
    [392.0,587.33].forEach(function(f,i){
      var o=actx.createOscillator(), g=actx.createGain();
      o.type='sine'; o.frequency.value=f;
      g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(0.06,t+0.6+i*0.1);
      g.gain.exponentialRampToValueAtTime(0.0001,t+3.2);
      o.connect(g).connect(actx.destination); o.start(t); o.stop(t+3.3);
    });
  }
</script>
</body>
</html>
